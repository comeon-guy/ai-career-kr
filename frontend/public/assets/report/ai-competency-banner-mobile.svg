<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="780" height="640" role="img" aria-hidden="true">
<!-- exact:나의 AI 활용 역량을 직접 확인해 보세요|이 직무의 실제 문제를 AI와 함께 해결하며, 나의 수행을 진단합니다.|문제 파악, 역할 나누기, 근거 확인, 결과 검증 등 6가지 기준으로 평가합니다.|AI 역량 진단 시작하기 → -->
  <defs>
    <linearGradient id="fcCtaBgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3F8FF"/>
      <stop offset="55%" stop-color="#F7FAFE"/>
      <stop offset="100%" stop-color="#EEF4FC"/>
    </linearGradient>
    <radialGradient id="fcCtaGlowM" cx="72%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#C9DBF8" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#C9DBF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="fcCtaSoftM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E3A5F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0.75" y="0.75" width="778.5" height="638.5" rx="18" ry="18" fill="url(#fcCtaBgM)" stroke="#C7D9F2" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="778.5" height="638.5" rx="18" ry="18" fill="url(#fcCtaGlowM)"/>

  <rect x="40" y="36" width="34" height="4" rx="2" fill="#3B82F6"/>

  <g font-family="Pretendard, 'Pretendard Variable', 'Noto Sans KR', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="96" fill="#121B2D" font-size="42" font-weight="700" letter-spacing="-0.6">
      <tspan x="40" dy="0">나의 AI 활용 역량을</tspan>
      <tspan x="40" dy="52">직접 확인해 보세요</tspan>
    </text>
    <text x="40" y="214" fill="#3A4558" font-size="34" font-weight="400" letter-spacing="-0.2">
      <tspan x="40" dy="0">이 직무의 실제 문제를 AI와 함께</tspan>
      <tspan x="40" dy="44">해결하며, 나의 수행을 진단합니다.</tspan>
    </text>
    <text x="40" y="324" fill="#7A8699" font-size="28" font-weight="400" letter-spacing="-0.1">
      <tspan x="40" dy="0">문제 파악, 역할 나누기, 근거 확인,</tspan>
      <tspan x="40" dy="40">결과 검증 등 6가지 기준으로 평가합니다.</tspan>
    </text>
  </g>

  <g transform="translate(500 380)" filter="url(#fcCtaSoftM)">
    <g transform="rotate(-8 50 60)">
      <rect x="8" y="4" width="96" height="120" rx="14" fill="#FFFFFF" stroke="#E6EEF8" stroke-width="1"/>
      <rect x="26" y="34" width="60" height="6" rx="3" fill="#D7E3F4"/>
      <rect x="26" y="50" width="50" height="6" rx="3" fill="#D7E3F4"/>
      <rect x="26" y="66" width="56" height="6" rx="3" fill="#D7E3F4"/>
      <rect x="26" y="82" width="42" height="6" rx="3" fill="#D7E3F4"/>
    </g>
    <g transform="translate(88 48)">
      <rect width="52" height="52" rx="13" fill="#FFFFFF" stroke="#E6EEF8" stroke-width="1"/>
      <path d="M26 12 C26.7 19 33.5 25.8 40.5 26.5 C33.5 27.2 26.7 34 26 41 C25.3 34 18.5 27.2 11.5 26.5 C18.5 25.8 25.3 19 26 12 Z" fill="#3B82F6"/>
    </g>
  </g>

  <g transform="translate(40 528)">
    <rect width="700" height="72" rx="14" fill="#172B49"/>
    <text x="350" y="46" text-anchor="middle" fill="#FFFFFF" font-family="Pretendard, 'Pretendard Variable', 'Noto Sans KR', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="600" letter-spacing="-0.2">AI 역량 진단 시작하기 →</text>
  </g>
</svg>
